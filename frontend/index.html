<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Meeting Studio – Transcription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <div class="control-panel">
        <h2>Meeting Studio</h2>
        <div class="control-group">
            <div class="file-row">
                <div class="file-input-wrapper">
                    <input type="file" id="audioFile" accept="audio/*">
                    <label for="audioFile" class="file-label">📁 Choose audio</label>
                </div>
                <button type="button" id="deleteFileBtn" class="delete-btn">🗑️ Remove</button>
            </div>
            <div id="fileName" class="file-name"></div>
            <div class="action-row">
                <button id="transcribeBtn" class="transcribe-btn">🎤 Transcribe</button>
            </div>
        </div>

        <div class="model-section">
            <label class="model-label">Choose the model version:</label>
            <div class="model-selector">
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="model_type" value="base" checked> Base
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="model_type" value="pro"> Pro
                    </label>
                </div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h3>📋 History</h3>
                <div class="history-actions">
                    <button id="refreshHistoryBtn" class="refresh-btn" title="Refresh history">⟳</button>
                    <button id="clearHistoryBtn" class="clear-btn" title="Clear all history">🗑️</button>
                </div>
            </div>
            <div id="historyList" class="history-list">
                <div class="history-placeholder">Loading history...</div>
            </div>
        </div>

        <div id="progress" class="progress-area"></div>
    </div>
    <div class="result-panel">
        <h2>Transcription results</h2>
        <div id="result" class="result-content">
            <div class="placeholder">Here will be a result</div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
